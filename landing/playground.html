<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Widget playground</title>
    <!--
      The stylesheet carries the styles of `WidgetCard.vue` and of every widget
      view this page can mount. `kavibay-widget` renders in light DOM so those
      shipping components style themselves instead of being copied; the rules
      are emitted here rather than inlined into the shadow root the palette uses.
    -->
    <link rel="stylesheet" href="embed/kavibay-embed.css" />
    <script type="module" defer src="embed/kavibay-embed.js"></script>
    <style>
      /*
       * Self-contained on purpose. landing/styles.css absolutely positions
       * kavibay-palette-demo for the overlay mock; that would fight this page.
       *
       * Plus Jakarta Sans is the app's default font (appearanceLogic). The
       * files already live next to this page for the marketing site.
       */
      @font-face {
        font-family: "Plus Jakarta Sans Variable";
        src: url("fonts/plus-jakarta-sans-latin-wght-normal.woff2") format("woff2");
        font-weight: 200 800;
        font-style: normal;
        font-display: swap;
      }

      html,
      body {
        margin: 0;
        /* Min, not fixed: the page grows with the desk and scrolls normally. */
        min-height: 100%;
      }

      body {
        font-family: "Plus Jakarta Sans Variable", "Plus Jakarta Sans", system-ui, sans-serif;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.72);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        /* Glass only reads as glass when something shows through it. The
           wallpaper stays put while the page scrolls, the way a desktop does. */
        background:
          url("images/desktop.jpg") center / cover no-repeat fixed,
          linear-gradient(160deg, #191922 0%, #0f0f15 100%) fixed;
      }

      /*
       * One centred column holds both the palette and the desk.
       *
       * They were two independent containers before — a 640px palette in the
       * middle and a desk spanning the whole window — and the cards read as
       * belonging to the page rather than to the search bar above them. Wide
       * enough for the two 520px cards side by side; anything wider would put
       * the palette adrift in the middle of it again.
       */
      .app {
        position: relative;
        box-sizing: border-box;
        width: min(1120px, calc(100vw - 48px));
        margin: 0 auto;
      }

      /*
       * A surface, not a layout.
       *
       * Cards are placed absolutely, each one carrying its own left/top, the
       * way the app places widgets from their manifest `defaultOffset` around
       * the palette. In a flex flow they were neighbours instead: resizing one
       * card pushed the next one along, and dragging one left a hole. Widgets
       * on a desk do neither.
       *
       * The height is stated because absolutely positioned children carry
       * none. The app has the same problem and solves it the same way — a desk
       * is as large as the window, not as large as its contents.
       *
       * The app floats its palette *over* the desk; here the two are stacked,
       * because the overlay version hid cards behind the search bar on a short
       * window and a playground that cannot be clicked teaches nothing.
       */
      /*
       * Cards start below where the palette opens, so the first view is not
       * the palette covering the desk. They may still be dragged under it —
       * that is what floating means.
       *
       * The clearance is in the cards' own coordinates, not in a margin on
       * this box. A top margin here collapses through `.app` — the parent has
       * no border or padding to stop it — and moved the whole container down,
       * palette included, so the gap it was supposed to open never appeared.
       */
      .desk {
        position: relative;
        box-sizing: border-box;
        min-height: 1360px;
        margin: 0 0 24px;
        /*
         * The desk is a surface, not a lid.
         *
         * It is positioned and comes after the palette in the document, so its
         * empty box painted over it and swallowed every click — the palette
         * could not be typed in, clicked or dragged. Hit testing does not need
         * a background; an element's box catches pointers regardless.
         *
         * Letting the gaps pass pointers through is also what the app does:
         * the desk there is a transparent window over the desktop, and
         * `clickThrough.ts` reports the card rectangles to Rust so everything
         * between them stays clickable.
         */
        pointer-events: none;
      }

      .desk kavibay-widget {
        position: absolute;
        pointer-events: auto;
      }

      /* A closed card leaves no gap behind it. */
      kavibay-widget:not([data-open]) {
        display: none;
      }

      /*
       * The palette floats over the desk, the way it does on the desktop.
       *
       * It used to sit above the desk in normal flow, which meant the result
       * list pushed every widget down the moment somebody typed a letter. A
       * search bar that rearranges the desk is a different product; this one
       * is summoned over whatever is already there.
       *
       * No z-index here: the element takes its own from the shared stacking
       * order, so clicking a card brings the card forward and clicking the
       * palette brings the palette back.
       */
      .stage {
        position: absolute;
        left: 50%;
        top: 24px;
        box-sizing: border-box;
        width: min(640px, 100%);
        transform: translateX(-50%);
      }

      .stage__hint {
        margin: 14px 0 0;
        font-size: 13px;
        line-height: 1.7;
        letter-spacing: 0.02em;
        text-align: center;
      }

      kbd {
        display: inline-block;
        padding: 1px 6px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        font: inherit;
        font-size: 12px;
      }

      kavibay-palette-demo,
      kavibay-widget {
        font-family: inherit;
        --surface-radius: 16px;
        --surface-corner-shape: round;
        --surface-bg-rgb: 28, 28, 32;
        --fg-rgb: 255, 255, 255;
        --inset-rgb: 0, 0, 0;
        --shadow-rgb: 0, 0, 0;
        --surface-alpha: 0.72;
        --surface-sheen: linear-gradient(
          177deg,
          rgba(255, 255, 255, 0.05) 0%,
          rgba(255, 255, 255, 0) 55%
        );
        --surface-border: rgba(255, 255, 255, 0.1);
        --surface-inner-highlight:
          inset 0 1px 0 rgba(255, 255, 255, 0.09), inset 0 0 0 1px rgba(255, 255, 255, 0.035);
        --surface-box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        --surface-backdrop-filter: blur(16px) saturate(1);
        --border: rgba(255, 255, 255, 0.1);
        --text: rgba(255, 255, 255, 0.92);
        --text-muted: rgba(255, 255, 255, 0.55);
        --text-faint: rgba(255, 255, 255, 0.4);
        --fill: rgba(255, 255, 255, 0.08);
        --fill-hover: rgba(255, 255, 255, 0.14);
        --bar-bg: rgba(0, 0, 0, 0.15);
        --row-selected-bg: rgba(255, 255, 255, 0.1);
        --row-selected-sheen: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.07) 0%,
          rgba(255, 255, 255, 0) 62%
        );
        --row-selected-rim:
          inset 0 1px 0 rgba(255, 255, 255, 0.13), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        --row-selected-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        --action-hover-bg: rgba(255, 255, 255, 0.14);
        --action-hover-rim: inset 0 0 0 1px rgba(255, 255, 255, 0.07);
      }

      kavibay-palette-demo {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <main class="stage">
        <kavibay-palette-demo autotype="false"></kavibay-palette-demo>
        <p class="stage__hint">
          The desk starts empty. Type a widget name · <kbd>↑</kbd> <kbd>↓</kbd> ·
          <kbd>Enter</kbd> opens it<br />
          Drag a card by its top strip · the <kbd>×</kbd> closes it again
        </p>
      </main>
      <!--
        Shipping widgets: the app's WidgetCard chrome, the app's widget runtime,
        and each widget's own view from its `view.ts`.

        Everything here needs neither the operating system nor a network call —
        the admission rule in core/embed/widget/catalog.ts — which is why these
        run unchanged in a browser.

        Clock carries `opens-on`, so it starts closed and appears when its
        palette row runs. The rest start open. Either way, closing a card and
        running its palette row again brings it back.

        The coordinates are this page's choice, the way `defaultOffset` is the
        manifest's on a real desk. Nothing here reflows: resize or drag one
        card and the others stay exactly where they are.
      -->
      <div class="desk">
        <!--
          Every card starts closed, so a refresh gives an empty desk and the
          palette is the only way in — which is how the app behaves after a
          fresh install, and the fastest way to see what the search bar is for.

          `opens-on` names the palette row that reveals a card. It repeats the
          definition name on purpose: a page may point a card at a different
          row, and spelling it out keeps that visible rather than implied.

          The coordinates are where a card lands once opened. They start at 320
          so the palette at rest sits above them; typing grows it over the top
          row, which is what floating means.
        -->
        <kavibay-widget definition="todo" opens-on="todo" style="left: 0; top: 320px"></kavibay-widget>
        <kavibay-widget definition="calculator" opens-on="calculator" style="left: 300px; top: 320px"></kavibay-widget>
        <kavibay-widget definition="emoji-picker" opens-on="emoji-picker" style="left: 520px; top: 320px"></kavibay-widget>
        <kavibay-widget definition="clock" opens-on="clock" style="left: 828px; top: 320px"></kavibay-widget>

        <kavibay-widget definition="pomodoro" opens-on="pomodoro" style="left: 0; top: 620px"></kavibay-widget>
        <kavibay-widget definition="stopwatch" opens-on="stopwatch" style="left: 560px; top: 620px"></kavibay-widget>

        <kavibay-widget definition="snake" opens-on="snake" style="left: 0; top: 920px"></kavibay-widget>
        <kavibay-widget definition="time-tracker" opens-on="time-tracker" style="left: 420px; top: 920px"></kavibay-widget>
        <kavibay-widget definition="timer" opens-on="timer" style="left: 780px; top: 920px"></kavibay-widget>

        <!--
          Redacted is an opaque cover for screensharing, so it renders as a
          black rectangle by design. On a desk full of widgets that reads as a
          broken card, which is why it opens from the palette like the rest and
          lands away from the crowd.
        -->
        <kavibay-widget definition="redacted" opens-on="redacted" style="left: 828px; top: 500px"></kavibay-widget>

        <!-- Both arrive in their own chunks. -->
        <kavibay-widget definition="notes" opens-on="notes" style="left: 300px; top: 620px"></kavibay-widget>
        <kavibay-widget definition="gallery" opens-on="gallery" style="left: 200px; top: 400px"></kavibay-widget>
      </div>
    </div>
  </body>
</html>
