<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Build a widget — end to end</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="embed/kavibay-embed.css" />
    <script type="module" defer src="embed/kavibay-embed.js"></script>
    <style>
      @font-face {
        font-family: "Plus Jakarta Sans Variable";
        src: url("fonts/plus-jakarta-sans-latin-wght-normal.woff2") format("woff2");
        font-weight: 200 800;
        font-style: normal;
        font-display: swap;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: "Plus Jakarta Sans Variable", "Plus Jakarta Sans", system-ui, sans-serif;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.72);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background:
          url("images/desktop.jpg") center / cover no-repeat fixed,
          linear-gradient(160deg, #191922 0%, #0f0f15 100%) fixed;
      }

      .app {
        position: relative;
        box-sizing: border-box;
        width: min(1120px, calc(100vw - 48px));
        margin: 0 auto;
      }

      /* The palette floats; the desk beneath it lets pointers through. */
      .stage {
        position: absolute;
        left: 50%;
        top: 24px;
        box-sizing: border-box;
        width: min(640px, 100%);
        transform: translateX(-50%);
      }

      .desk {
        position: relative;
        box-sizing: border-box;
        min-height: 1100px;
        margin: 0 0 24px;
        pointer-events: none;
      }

      .desk kavibay-widget {
        position: absolute;
        pointer-events: auto;
      }

      kavibay-widget:not([data-open]) {
        display: none;
      }

      .hint {
        margin: 14px 0 0;
        font-size: 13px;
        line-height: 1.7;
        text-align: center;
      }

      kavibay-palette-demo,
      kavibay-widget {
        font-family: inherit;
        --surface-radius: 16px;
        --surface-corner-shape: round;
        --surface-bg-rgb: 28, 28, 32;
        --fg-rgb: 255, 255, 255;
        --inset-rgb: 0, 0, 0;
        --shadow-rgb: 0, 0, 0;
        --surface-alpha: 0.72;
        --surface-sheen: linear-gradient(
          177deg,
          rgba(255, 255, 255, 0.05) 0%,
          rgba(255, 255, 255, 0) 55%
        );
        --surface-border: rgba(255, 255, 255, 0.1);
        --surface-inner-highlight:
          inset 0 1px 0 rgba(255, 255, 255, 0.09), inset 0 0 0 1px rgba(255, 255, 255, 0.035);
        --surface-box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        --surface-backdrop-filter: blur(16px) saturate(1);
        --border: rgba(255, 255, 255, 0.1);
        --text: rgba(255, 255, 255, 0.92);
        --text-muted: rgba(255, 255, 255, 0.55);
        --text-faint: rgba(255, 255, 255, 0.4);
        --fill: rgba(255, 255, 255, 0.08);
        --fill-hover: rgba(255, 255, 255, 0.14);
        --bar-bg: rgba(0, 0, 0, 0.15);
        --row-selected-bg: rgba(255, 255, 255, 0.1);
        --row-selected-sheen: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.07) 0%,
          rgba(255, 255, 255, 0) 62%
        );
        --row-selected-rim:
          inset 0 1px 0 rgba(255, 255, 255, 0.13), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        --row-selected-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        --action-hover-bg: rgba(255, 255, 255, 0.14);
        --action-hover-rim: inset 0 0 0 1px rgba(255, 255, 255, 0.07);
      }

      kavibay-palette-demo {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <main class="stage">
        <!--
          `tour` starts the page-level choreography in core/embed/demo/tour.ts:
          type "new widget", let the Wizard build one, close it, then find the
          finished widget by name. The first click or keystroke stops it.
        -->
        <kavibay-palette-demo tour="true"></kavibay-palette-demo>
        <p class="hint">
          Everything below is played automatically. Click or type to take over.
        </p>
      </main>

      <div class="desk">
        <!--
          Both start closed: the page opens with nothing but a search bar, and
          the palette is what brings each of them in.

          The second card holds no catalog widget — `draft` names the package
          the Wizard writes during the tour, and it runs in a sandboxed frame
          exactly as a stranger's widget would.
        -->
        <kavibay-widget
          definition="widget-wizard"
          opens-on="new-widget"
          autoplay
          style="left: 0; top: 300px"
        ></kavibay-widget>

        <kavibay-widget
          definition="water-tracker"
          draft="water-tracker"
          card-title="Water"
          opens-on="water-tracker"
          style="left: 300px; top: 320px"
        ></kavibay-widget>
      </div>
    </div>
  </body>
</html>
