[package]
name = "kavibay"
version = "0.1.0"
description = "Raycast-like launcher prototype"
authors = ["you"]
edition = "2021"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kavibay_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is required by `macOSPrivateApi` in tauri.conf.json — without
# it a transparent window is simply opaque on macOS, and the whole overlay look is
# gone. The trade is deliberate: it rules out App Store distribution.
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
rmcp = { version = "3.1.4", default-features = false, features = ["server", "transport-streamable-http-server"] }
sysinfo = "0.39.6"
starship-battery = "0.11"
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico", "gif"] }
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json", "stream"] }
futures-util = "0.3"
regex = "1"
url = "2"
percent-encoding = "2"
arboard = "3"
sha2 = "0.11"
# Widget export writes its own zip: one deflate stream per file plus two
# headers. Both crates are already in the tree through reqwest, so this pins no
# new download — and a zip crate would add archive reading and encryption that
# nothing here uses.
flate2 = "1"
crc32fast = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["time", "net", "io-util", "rt"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rand = "0.10"
open = "5"
# AES-256-GCM for the macOS secret backend (`security/secrets.rs`). Already in
# the tree through rustls, so this pins no new download; it is not macOS-only so
# the sealed format stays under test on the Windows CI job too.
ring = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.7"
# The login keychain holds the key `security/secrets.rs` seals with. The one new
# download of the macOS secret backend: the CoreFoundation ownership rules and
# OSStatus mapping are exactly what hand-written FFI would get wrong.
# `core-foundation` is already in the tree through tao; it builds the item data.
security-framework = { version = "3.7", default-features = false }
core-foundation = "0.10"
# The Ctrl double tap (`ctrl_double_tap.rs`) watches Control through an NSEvent
# global monitor, the one source that needs no permission, and reads the HID
# key-down counter to learn whether another key went down in between. All three
# are already in the tree through tao, so this pins no new download. "Hide on
# outside click" counts mouse presses through a second monitor (`MouseButtons`
# in lib.rs).
block2 = { version = "0.6", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSEvent", "block2"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGEventSource", "CGEventTypes"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Global mouse button state for "Hide on outside click" (XQueryPointer). Already in
# the tree via arboard/global-hotkey, so this pins no new version — and its own
# connection keeps the read off GDK, which is not safe from the watcher thread.
x11rb = "0.14"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
tauri-winrt-notification = "0.8.1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  # The click-through watcher reads the window's DPI without a UI-thread round trip.
  "Win32_UI_HiDpi",
  # Quick actions ask UI Automation whether the focused control is read-only.
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_Storage_FileSystem",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  # Reading the CanIncludeInClipboardHistory flag password managers set.
  "Win32_System_Memory",
  "Win32_System_Shutdown",
  "Win32_System_Environment",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_Security_Cryptography",
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage",
  "Storage_Search",
  "Storage_Streams",
] }


[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
