<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Widget sandbox</title>
    <style>
      /*
        The tokens the host pushes are custom properties on this document's
        root; these are what consume them. The fallbacks matter: they are what
        renders in the moment between the document loading and the first theme
        message, and getting that wrong is a flash of black-on-white serif
        inside a dark overlay.
      */
      html, body {
        height: 100%;
        margin: 0;
        background: transparent;
        color-scheme: var(--native-color-scheme, dark);
        font-family: var(--font-family, system-ui, -apple-system, "Segoe UI", sans-serif);
        color: var(--text, rgba(255, 255, 255, 0.92));
      }
      #app { height: 100%; }
    </style>
  </head>

  <body>
    <!--
      The guest document for SandboxedWidgetFrame. Served from the app's own
      origin, which the CSP's `frame-src 'self'` allows; the iframe's
      sandbox="allow-scripts" is what makes it an opaque origin regardless, so
      the code below cannot reach the cockpit's storage or tauri's invoke even
      though the URL is the app's.

      Dev-only for now, like extension-host-dev.html: not listed in
      vite.config.ts `build.rollupOptions.input`, so the dev server serves it and
      a production build does not contain it. When generated widgets arrive this
      is the document that moves to the package root, and the frame's entryUrl
      prop is the only thing that changes.
    -->
    <div id="app"></div>
    <script type="module" src="/core/app/extension-host-sandbox/main.ts"></script>
  </body>
</html>
