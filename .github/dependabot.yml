version: 2

# Grouped on purpose: one PR per ecosystem per week. Ungrouped Dependabot produces
# thirty PRs a month and trains everyone to ignore the notifications.
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    # typescript 7 removed baseUrl and dropped the lib/tsc entry point that
    # vue-tsc resolves. A major bump here is a migration, not a dependency
    # update, so it must not arrive as one. Drop this once vue-tsc supports it.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: chore, include: scope }
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    # cairo-rs (Linux only) must match the version gtk 0.18 builds against; a
    # lone cairo bump breaks the Linux build. It moves together with gtk, by hand.
    ignore:
      - dependency-name: cairo-rs
    commit-message: { prefix: chore, include: scope }
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: chore, include: scope }
    groups:
      actions:
        patterns: ["*"]
