version: 2

# Grouped on purpose: one PR per ecosystem per week. Ungrouped Dependabot produces
# thirty PRs a month and trains everyone to ignore the notifications.
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    # typescript 7 removed baseUrl and dropped the lib/tsc entry point, which
    # vue-tsc resolves and typescript-eslint still caps below 6.1. A major bump
    # here is a migration, not a dependency update, so it must not arrive as one.
    # Drop this once both declare TypeScript 7.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: chore, include: scope }
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    commit-message: { prefix: chore, include: scope }
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: chore, include: scope }
    groups:
      actions:
        patterns: ["*"]
