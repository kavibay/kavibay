name: Bug report
description: Something in Kavibay does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Kavibay version
      description: Settings → About, or the installer filename.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux (X11)
        - Linux (Wayland)
        - macOS
    validations:
      required: true

  - type: input
    id: widget
    attributes:
      label: Which widget?
      description: Leave empty if it is not about a specific widget.

  - type: textarea
    id: extra
    attributes:
      label: Screenshot or console output
      description: Anything visual helps. Console output comes from the webview devtools.
