name: Label PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target is required so fork PRs can be labelled, and is safe here
      # only because this job never checks out or runs the PR's code.
      - uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
